name: Hinge Opener APK

on:
  push:
    paths:
      - "hinge-opener/**"
      - ".github/workflows/hinge-opener-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hinge-opener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hinge-opener-apk
          path: hinge-opener/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
